<table class="table table-striped table-sm">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nombre</th>
      <th scope="col">Email</th>
    </tr>
  </thead>
  <tbody>
    @if (cargando) {
      <tr>
        <td colspan="3">Cargando contactos...</td>
      </tr>
    } @else {
      @for (contact of contacts; track contact.id) {
        <app-contact-row [contact]="contact"></app-contact-row>
      }
    }
  </tbody>
</table>
